<svg filter="url(#burton-sketch)" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Drift the calm drape-creature, surprised">
  <title>Drift</title>
  <defs>
    <filter id="burton-sketch" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Hand-drawn wobbly displacement -->
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="wobbly" />
      
      <!-- Mute colors for a gothic palette -->
      <feColorMatrix in="wobbly" type="saturate" values="0.35" result="muted" />
      
      <!-- Boost contrast slightly -->
      <feComponentTransfer in="muted" result="final">
        <feFuncR type="linear" slope="1.1" intercept="-0.05" />
        <feFuncG type="linear" slope="1.1" intercept="-0.05" />
        <feFuncB type="linear" slope="1.1" intercept="-0.05" />
      </feComponentTransfer>
    </filter>

    <style>
      .drift-body{fill:#F5F0E6;stroke:#1A1623;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
      .drift-eye{fill:#F5F0E6;stroke:#1A1623;stroke-width:1.5}
      .drift-pupil{fill:#1A1623}
      .drift-mouth{fill:#1A1623;stroke:#1A1623;stroke-width:1.5}
      .drift-accent{fill:#7AA2C4;stroke:#1A1623;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
      .hem{fill:#5E8A8C;stroke:#1A1623;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:0.75}
      .detail{fill:none;stroke:#1A1623;stroke-width:1;stroke-linecap:round}
    </style>
  </defs>
  <path d="M74 176 C62 154 62 120 68 94 C74 62 86 34 104 30 C124 34 136 66 140 98 C144 128 142 156 134 176 Z" fill="#4A3A5C" opacity="0.35"/>
  <path class="drift-body" d="M70 170 C60 148 60 118 66 92 C72 60 82 28 100 26 C120 30 128 62 132 94 C136 122 134 152 128 170 Q122 168 118 174 Q112 166 108 174 Q100 166 96 174 Q90 166 86 174 Q80 166 76 174 Q72 168 70 170 Z"/>
  <path class="detail" d="M86 60 C82 90 82 130 88 160" opacity="0.4"/>
  <path class="detail" d="M114 60 C118 90 118 130 112 160" opacity="0.4"/>
  <path class="hem" d="M66 158 C78 164 92 164 100 162 C110 164 124 164 134 158 C132 166 128 172 128 170 Q122 168 118 174 Q112 166 108 174 Q100 166 96 174 Q90 166 86 174 Q80 166 76 174 Q72 168 70 170 Q68 164 66 158 Z"/>
  <path class="drift-accent" d="M60 118 C80 112 120 112 140 118 L140 128 C120 122 80 122 60 128 Z"/>
  <path class="drift-accent" d="M58 120 L50 112 L54 132 Z"/>
  <path class="drift-accent" d="M142 120 L150 112 L146 132 Z"/>
  <circle cx="88" cy="84.5" r="14.5" fill="#1A1623" opacity="0.35" />
  <circle class="drift-eye" cx="88" cy="82" r="10"/>
  <circle cx="112" cy="84.5" r="14.5" fill="#1A1623" opacity="0.35" />
  <circle class="drift-eye" cx="112" cy="82" r="10"/>
  <circle class="drift-pupil" cx="89" cy="82" r="2"/>
  <circle class="drift-pupil" cx="113" cy="82" r="2"/>
  <ellipse class="drift-mouth" cx="100" cy="104" rx="3.5" ry="5"/>
  <circle fill="#F5F0E6" stroke="#1A1623" stroke-width="1" cx="132" cy="72" r="3"/>
</svg>
